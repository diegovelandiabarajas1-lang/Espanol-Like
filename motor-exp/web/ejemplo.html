<body>
<h1>Una página de HTML que habla Ñ</h1>
<p>Lo de abajo no es JavaScript: el navegador lee las etiquetas <code>&lt;script type="text/ñ"&gt;</code> con el motor de Ñ.</p>

<script type="text/ñ">
  var clics = 0
  fn ver() {
    limpiarPagina()
    pintar(etiqueta("h2", "Hola desde Ñ"))
    pintar(etiqueta("p", "Llevas {clics} clic(s)."))
    pintar(boton("Otro más", fn() { clics = clics + 1  ver() }))
  }
  ver()
  imprimir("listo: esto sale en la consola del navegador y aquí debajo")
</script>
